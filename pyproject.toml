[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "owl-agent"
version = "4.5.0"
description = "OWL-AGENT — self-optimising proxy HTTP client with an async API server"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["proxy", "http-client", "scraping", "asyncio", "web-scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: POSIX :: Linux",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx[socks]>=0.25.0",
    "aiohttp>=3.9.0",
    "aiofiles>=23.0.0",
    "proxybroker2>=2.0.0a4",  # only release on PyPI is the 2.0.0a4 pre-release
    "resilient-httpx>=0.1.0",
    "circuitbreaker>=2.0.0",
    "curl_cffi>=0.5.0",
    "redis>=5.0.0",
    "prometheus-client>=0.19.0",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "xgboost>=2.0.0",
    "joblib>=1.3.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
owl-server = "owl_server:cli"

[tool.setuptools]
# Flat layout: the modules live at the repo root and are installed as
# top-level importable modules (keeps `import proxy_defense` working).
# Note: mcp-server.py is intentionally not packaged (hyphenated filename
# cannot be a Python module) — it is run as a plain script.
py-modules = ["owl_server", "proxy_defense", "ml_models", "plugin_loader"]
