# OWL-AGENT CI — lint + full pytest suite on every push/PR
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: |
          pip install ruff

      - name: Run ruff linter
        run: |
          ruff check . --select E,F,W --ignore E501,E741,F841
        working-directory: .

      - name: Run ruff format check
        run: |
          ruff format --check . || true
        working-directory: .

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      OWL_TEST_MODE: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libssl-dev \
            libffi-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip wheel setuptools
          pip install -r requirements.txt
        working-directory: .

      - name: Verify critical imports
        run: |
          python -c "
          import aiohttp, httpx, curl_cffi, circuitbreaker, proxybroker2
          print('Core imports OK')
          import sklearn, numpy
          print(f'ML imports OK (scikit-learn={sklearn.__version__}, numpy={numpy.__version__})')
          "
        working-directory: .

      - name: Run full test suite
        run: |
          python -m pytest tests/ -v --tb=short
        working-directory: .
        timeout-minutes: 15
