# Creates a GitHub Release with the prebuilt proxy binaries when a v* tag is
# pushed. Can also be triggered manually (builds only, no release is created).
#
# Cross-platform: the Go binaries are built for linux-amd64, linux-arm64,
# windows-amd64 and darwin-arm64. arm64 cross-builds (and all release
# binaries) use CGO_ENABLED=0 so assets are fully static. The upstream Rust
# https_proxy is Unix-only (uses std::os::unix and TCP_FASTOPEN in
# src/net.rs), so it is built on Linux and macOS only. Every asset is named
# after the platform it was built for (e.g. owl-prox5-linux-arm64,
# owl-prox5-windows-amd64.exe, https_proxy-aarch64-apple-darwin).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prox5:
    name: Build owl-prox5 (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goarch: amd64
          - target: linux-arm64
            os: ubuntu-latest
            goarch: arm64
          - target: windows-amd64
            os: windows-latest
            goarch: amd64
          - target: darwin-arm64
            os: macos-latest
            goarch: arm64
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Build owl-prox5 for platform
        id: build
        shell: bash
        run: |
          bash proxies/prox5/build.sh
          GOOS="$(go env GOOS)"; GOARCH="$(go env GOARCH)"
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          echo "asset=owl-prox5-$GOOS-$GOARCH$EXT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.asset }}
          path: proxies/bin/${{ steps.build.outputs.asset }}
          if-no-files-found: error

  build-https-proxy-go:
    name: Build https_proxy_go (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-amd64
            os: ubuntu-latest
            goarch: amd64
          - target: linux-arm64
            os: ubuntu-latest
            goarch: arm64
          - target: windows-amd64
            os: windows-latest
            goarch: amd64
          - target: darwin-arm64
            os: macos-latest
            goarch: arm64
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Vet and test (native arch only)
        shell: bash
        if: matrix.goarch == 'amd64'
        run: |
          cd proxies/https_proxy_go && go vet ./... && go test -count=1 ./...

      - name: Build https_proxy_go for platform
        id: build
        shell: bash
        run: |
          bash proxies/https_proxy_go/build.sh
          GOOS="$(go env GOOS)"; GOARCH="$(go env GOARCH)"
          EXT=""; [ "$GOOS" = "windows" ] && EXT=".exe"
          echo "asset=https_proxy_go-$GOOS-$GOARCH$EXT" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.asset }}
          path: proxies/bin/${{ steps.build.outputs.asset }}
          if-no-files-found: error

  build-https-proxy-rust:
    name: Build https_proxy (upstream Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Unix-only upstream (std::os::unix, TCP_FASTOPEN) — no Windows build.
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and rename upstream https_proxy for platform
        id: build
        shell: bash
        run: |
          bash proxies/https_proxy/build.sh
          HOST="$(rustc -vV | sed -n 's/^host: //p')"
          ASSET="https_proxy-$HOST"
          mv proxies/bin/https_proxy "proxies/bin/$ASSET"
          echo "asset=$ASSET" >> "$GITHUB_OUTPUT"
          echo "✅ Produced $ASSET"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.asset }}
          path: proxies/bin/${{ steps.build.outputs.asset }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-prox5, build-https-proxy-go, build-https-proxy-rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-pypi:
    name: Publish owl-agent to PyPI
    needs: [release]
    # Only clean semver tags publish (v0.4.5-test and other suffix tags are skipped).
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml version
        run: |
          PKG_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$PKG_VERSION" ] || [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PKG_VERSION:-<missing>}"
            exit 1
          fi
          echo "✅ Tag ${GITHUB_REF_NAME} matches pyproject.toml version ${PKG_VERSION}"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (Trusted Publishing or PYPI_API_TOKEN)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
