# Creates a GitHub Release with the prebuilt proxy binaries when a v* tag is
# pushed. Can also be triggered manually (builds only, no release is created).
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prox5:
    name: Build prox5 (Go)
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build owl-prox5
        run: |
          bash proxies/prox5/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: owl-prox5
          path: proxies/bin/owl-prox5
          if-no-files-found: error

  build-https-proxy-go:
    name: Build https_proxy (Go port)
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Vet and test
        run: |
          cd proxies/https_proxy_go && go vet ./... && go test ./... -v

      - name: Build https_proxy_go
        run: |
          bash proxies/https_proxy_go/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: https_proxy_go
          path: proxies/bin/https_proxy_go
          if-no-files-found: error

  build-https-proxy-rust:
    name: Build https_proxy (upstream Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build upstream https_proxy
        run: |
          bash proxies/https_proxy/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: https_proxy
          path: proxies/bin/https_proxy
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [build-prox5, build-https-proxy-go, build-https-proxy-rust]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true

  publish-pypi:
    name: Publish owl-agent to PyPI
    needs: [release]
    # Only clean semver tags publish (v0.4.5-test and other suffix tags are skipped).
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml version
        run: |
          PKG_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$PKG_VERSION" ] || [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ Tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PKG_VERSION:-<missing>}"
            exit 1
          fi
          echo "✅ Tag ${GITHUB_REF_NAME} matches pyproject.toml version ${PKG_VERSION}"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (Trusted Publishing or PYPI_API_TOKEN)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
